# 自治会運営AI支援（仮称）の Workers の設定。担当は束 1。他の束は触らず、足りない物は PM に言う。
#
# この設定は staging（jichikai-sasae-staging）。本番は提供側が委託の根拠を確かめた後に
# [env.production] として別に足す。wrangler deploy の既定が staging なので、本番への誤配備は起きない。
name = "jichikai-sasae-staging"
main = "src/index.ts"
compatibility_date = "2026-08-01"
# @anthropic-ai/sdk（束 2）と vitest-pool-workers が node の互換を要する
compatibility_flags = ["nodejs_compat"]

# 公開の URL。提供側のドメインの下に置く。workers.dev の URL は開けない
workers_dev = false
routes = [{ pattern = "jichikai.aobane-tsumugu.com", custom_domain = true }]

[vars]
# 区のページの固定 URL の根。QR に刷る
PUBLIC_BASE_URL = "https://jichikai.aobane-tsumugu.com"
# デモの環境だけの断り書き。本番では置かない

# 表。区ごとの行は全部 ward_id を持つ。migrations/ は束の番号で置く（束 N は NN01_*.sql から）
[[d1_databases]]
binding = "DB"
database_name = "jichikai-sasae-staging"
# staging の D1（wrangler d1 create の結果）。ローカルと試験は、この id によらず手元の D1 で動く
database_id = "2f199b1c-5802-4276-97e0-ef4b2c719764"
migrations_dir = "migrations"

# 物置。原本、出した物、写し。キーは必ず区の ID で始める（src/core/storage.ts）
[[r2_buckets]]
binding = "ORIGINALS"
bucket_name = "jichikai-sasae-staging"

[[r2_buckets]]
binding = "ORIGINALS_BACKUP"
bucket_name = "jichikai-sasae-staging-backup"

# ブラウザで写しを作れなかった写真を、非公開のまま読み取り用に縮める。
[images]
binding = "IMAGES"

# Cron。実行の振り分けは src/index.ts の scheduled が各置き場の index.ts へ渡す。
# 式の定数は src/core/cron.ts。式を足す時は PM に言う。
[triggers]
crons = ["*/5 * * * *", "0 18 * * *"]

# 鍵は Workers の secrets に置く。ここには名前だけを書き、値は書かない（src/env.ts と同じ名前）。
#   ANTHROPIC_FEDERATION_SIGNING_KEY
#   ANTHROPIC_FEDERATION_RULE_ID
#   ANTHROPIC_ORGANIZATION_ID
#   ANTHROPIC_SERVICE_ACCOUNT_ID
#   ANTHROPIC_WORKSPACE_ID
#   ANTHROPIC_WEBHOOK_SIGNING_KEY
#   LINE_CHANNEL_SECRET
#   LINE_CHANNEL_ACCESS_TOKEN
#   OPS_ID / OPS_PASSWORD（運用の画面。使う段で入れる）
# 鍵のファイルから入れるには scripts/put-secrets.ts、ローカルは .dev.vars（git に入らない）を
# scripts/make-dev-vars.ts で作る。

